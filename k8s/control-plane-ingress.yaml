apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubedb-monitor-control-plane-ingress
  namespace: kubedb-monitor
  labels:
    app.kubernetes.io/part-of: kubedb-monitor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: kubedb-monitor-control-plane
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kube-db-mon-controlplane.bitgaram.info
    secretName: kube-db-mon-controlplane-tls
  rules:
  - host: kube-db-mon-controlplane.bitgaram.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubedb-monitor-control-plane
            port:
              number: 8080